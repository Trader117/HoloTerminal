name: Release
# Publish a GitHub release (tag like v0.3.0) and this builds holo-terminal.zip and module.json for it.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version and download URL
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" --arg d "https://github.com/$REPO/releases/download/$TAG/holo-terminal.zip" \
            '.version=$v | .download=$d' module.json > module.tmp && mv module.tmp module.json
      - name: Zip module
        run: zip -r holo-terminal.zip module.json scripts templates styles lang sheet README.md
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" holo-terminal.zip module.json --clobber
